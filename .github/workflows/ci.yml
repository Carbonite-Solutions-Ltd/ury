name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  # PRs key on the PR number; pushes fall back to the ref, so a push to
  # develop can't share a lane with an unrelated PR and cancel it. The
  # old group was "develop-ury-${{ github.event.number }}", which
  # evaluates to "develop-ury-" for EVERY push event — with
  # cancel-in-progress on, concurrent pushes cancelled each other.
  group: ci-ury-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      # Redis is REQUIRED, and its absence is what actually killed the run
      # (MariaDB alone is not enough). `bench init
      # --skip-redis-config-generation` tells bench not to generate a local
      # redis config because it expects redis to already be reachable — it
      # does NOT mean "no redis needed". ERPNext's after_install →
      # set_single_defaults → doc.save() writes through the cache, so the
      # install died with:
      #   "An error occurred while installing erpnext:
      #    Error 111 connecting to 127.0.0.1:11000. Connection refused."
      # The ports below are the defaults frappe writes into
      # common_site_config.json: 13000 = cache, 11000 = queue.
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      # All four actions below were pinned at @v2. GitHub now HARD-FAILS
      # actions/cache@v2 during "Set up job", before a single step runs —
      # which is why every run died in ~3s with no useful output. The
      # others sit on retired Node runtimes and were next in line.
      - name: Clone
        uses: actions/checkout@v4

      # Python 3.10 could never have worked against version-16: frappe's
      # pyproject.toml declares requires-python = ">=3.14,<3.15" and
      # erpnext's ">=3.14", so `bench init` fails the interpreter check.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Likewise Node 14 — frappe's package.json declares engines.node
      # ">=24", and this repo's own React POS needs a modern Node to build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        # `::set-output` was disabled by GitHub in 2023. Writing to the
        # $GITHUB_OUTPUT file is the replacement; the old form produced an
        # empty `dir`, so the cache step below was keyed on an empty path
        # and never actually cached anything.
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup
        run: |
          pip install frappe-bench
          # --frappe-branch is REQUIRED. Without it `bench init` clones
          # frappe's `develop` (currently 17.0.0-dev), while erpnext
          # version-16 requires frappe ">=16.21.0,<17.0.0" — CI then warns
          # "App 'erpnext' might not work as expected" and carries on onto
          # a mismatched stack, which is worse than failing outright. Pin
          # frappe to the same branch as erpnext and as the real bench.
          bench init --frappe-branch version-16 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          # ERPNext is a HARD dependency: ury/hooks.py declares
          # `required_apps = ["erpnext"]`, so `install-app ury` refuses to
          # run without it. The old workflow never fetched it, so this job
          # could not have passed even before the actions went stale.
          bench get-app --branch version-16 erpnext
          bench get-app ury "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app ury
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ury
        env:
          TYPE: server
