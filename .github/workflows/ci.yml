name: CI

# ═══════════════════════════════════════════════════════════════
#  Fast, bench-free checks.
#
#  This workflow used to stand up a WHOLE Frappe bench on every run —
#  install frappe, clone erpnext, start MariaDB + Redis, create a site,
#  install ury — just to reach `bench run-tests --app ury`. That is
#  ~4 minutes of setup before a single assertion, repeated per push,
#  because a GitHub-hosted runner is a fresh bare VM with nothing cached.
#
#  By decision (2026-07-30) the real test suite runs on the LOCAL bench
#  instead, where the world already exists. The 171 tests in this repo
#  all ship a `run_*_tests()` wrapper for exactly that:
#
#      bench --site <site> execute ury.<module>.run_<name>_tests
#
#  A public prebuilt container with frappe + erpnext baked in is the
#  planned way to bring those tests back here without paying the setup
#  cost every time. Until then CI only runs what needs NO bench.
#
#  That is not nothing. These checks catch the failure modes this repo
#  has actually hit — a syntax error, a mangled fixture, a duplicated
#  doctype key, a broken frontend build.
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - develop
      - version-16
  pull_request:

concurrency:
  # PRs key on the PR number; pushes fall back to the ref, so a push
  # can't share a lane with an unrelated PR and cancel it.
  group: ci-ury-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Static Checks

    steps:
      - name: Clone
        uses: actions/checkout@v4

      # Match the stack's real target so syntax checking is faithful:
      # frappe's pyproject.toml declares requires-python ">=3.14,<3.15".
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # frappe's package.json declares engines.node ">=24".
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: yarn
          # ONLY pos/yarn.lock — it's the only lockfile committed to the
          # repo. The root and URYMosaic lockfiles are untracked, and
          # setup-node hard-errors ("Some specified paths were not
          # resolved") if a cache-dependency-path matches nothing in a
          # fresh clone.
          cache-dependency-path: pos/yarn.lock

      # Catches syntax errors without needing frappe importable — this is
      # a compile, not an import, so `import frappe` at module top level
      # is irrelevant.
      - name: Python syntax
        run: python -m compileall -q ury

      # Guards the fixture-mangling trap: round-tripping
      # custom_field.json through Python's json module rewrites every
      # em-dash as — and renormalises the indent, producing a
      # 2000-line diff. A broken file here silently breaks `bench migrate`
      # on every site.
      - name: JSON validity (fixtures + doctypes)
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = []
          for p in sorted(set(glob.glob('ury/fixtures/*.json') + glob.glob('ury/**/*.json', recursive=True))):
              try:
                  json.load(open(p))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("Invalid JSON:")
              [print("  " + b) for b in bad]
              sys.exit(1)
          print("all JSON files parse")
          PY

      # A repeat offender: `get_custom_fields()` is one big dict literal,
      # so a second `"POS Invoice": [...]` key silently DISCARDS the first
      # — Python keeps only the last. That shipped once and quietly
      # dropped a batch of custom fields on every install.
      - name: No duplicate doctype keys in setup.py
        run: |
          python - <<'PY'
          import ast, sys
          dupes = set()
          for node in ast.walk(ast.parse(open('ury/setup.py').read())):
              if isinstance(node, ast.Dict):
                  keys = [k.value for k in node.keys
                          if isinstance(k, ast.Constant) and isinstance(k.value, str)]
                  dupes |= {k for k in keys if keys.count(k) > 1}
          if dupes:
              print(f"Duplicate keys in setup.py (later ones silently win): {sorted(dupes)}")
              sys.exit(1)
          print("no duplicate doctype keys")
          PY

      # The highest-value check here. The deploy workflow runs `yarn build`
      # ON THE SERVER, *after* `git reset --hard` — so a build that fails
      # there leaves the bench half-updated: new Python code, stale or
      # missing frontend assets. Catching it on the runner first means a
      # broken build never reaches production.
      #
      # Note this does NOT typecheck: `yarn build` is `vite build`, and
      # `tsc` can't be gated here because the committed
      # pos/src/privateKey.ts placeholder is intentionally not valid TS.
      - name: Build frontends (pos + URYMosaic)
        run: |
          # Plain `yarn install` — NOT --frozen-lockfile. The root
          # yarn.lock isn't committed, so a fresh clone has none and
          # --frozen-lockfile would fail outright. The root install's
          # postinstall hook is what installs both frontends.
          yarn install
          yarn build

      # Non-blocking on purpose. There are pre-existing lint errors in the
      # POS (mostly `catch (err: any)`), so gating on this would paint CI
      # red from day one and train everyone to ignore it. It still surfaces
      # new problems as annotations. Flip to a hard gate once the existing
      # ones are cleared.
      - name: ESLint (advisory)
        continue-on-error: true
        working-directory: pos
        run: npx eslint src
